name: claude

# Агент Claude Code по команде в комментарии: отвечает в обсуждении issue или PR, правит ветку PR.
# Описание, модель, бюджет запусков и как остановить: README.md, раздел «Агент в GitHub»
run-name: 'claude #${{ github.event.issue.number || github.event.pull_request.number }}'

on:
  # Обсуждение issue или pull request
  issue_comment:
    types: [created]
  # Комментарий к строке diff в pull request
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Модель вызывается только по команде @claude от владельца или участника с доступом к репозиторию.
    # Комментарии ботов, в том числе ответы самого агента и авторевью, пропускаются. Правка комментария
    # не запускает агента повторно: события только created
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Один прогон агента на issue или PR. Пока он идёт, следующая команда ждёт в очереди; ожидать может
    # только одна: более поздняя команда заменяет ожидающую (её задание отменяется, не начавшись).
    # Очередь заодно делает подсчёт бюджета точным: прошлые прогоны этого PR к проверке уже завершены
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Стандартная авторизация через Claude GitHub App: action обменивает OIDC-токен на токен приложения,
    # и комментарии и push идут с правами приложения. issues: write нужен скиллам to-spec и to-tickets:
    # они публикуют спецификацию и тикеты командами gh, которым нужен GH_TOKEN (см. шаг агента).
    # actions: read — счётчик бюджета по истории прогонов
    permissions:
      contents: read
      id-token: write
      issues: write
      actions: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      used: ${{ steps.budget.outputs.used }}
    steps:
      # Бюджет запусков на PR проверяется кодом до вызова модели. Счётчик — история Actions этого воркфлоу
      # (run-name «claude #N»), которую токен агента переписать не может: у Claude App нет actions: write
      - name: Check run budget
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          # Допущенных запросов к агенту на один PR
          LIMIT: 3
        run: |
          set -euo pipefail
          if [ "$IS_PR" != true ]; then
            # В issue бюджета нет: там идут triage, to-spec, to-tickets и implement-spec
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "used=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Попытка израсходована, если шаг агента начался: успех, ошибка, отмена во время работы, таймаут.
          # Каждая попытка прогона (Re-run) считается отдельно, включая прежние попытки этого прогона.
          # Не начавшиеся (бюджет исчерпан, команда заменена в очереди) не считаются
          used=0
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/workflows/claude.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.display_title == \"claude #${NUMBER}\" and .conclusion != \"skipped\") | .id")
          for id in $ids; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?filter=all&per_page=100" \
              --jq '[.jobs[] | select(.name == "claude") | .steps[] | select(.name == "Run Claude Code" and .conclusion != null and .conclusion != "skipped")] | length')
            used=$((used + n))
          done
          echo "used=${used}" >> "$GITHUB_OUTPUT"
          if [ "$used" -ge "$LIMIT" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Бюджет PR #${NUMBER} исчерпан: ${used} из ${LIMIT}, агент не вызывается"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Запуск $((used + 1)) из ${LIMIT} для PR #${NUMBER}"
          fi

      # Без ключа модели запуск бессмыслен: отчёт покажет причину infra
      - name: Check model key
        if: steps.budget.outputs.allowed == 'true'
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::Нет секрета CLAUDE_CODE_OAUTH_TOKEN или ANTHROPIC_API_KEY"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.budget.outputs.allowed == 'true'
        with:
          persist-credentials: false

      # Node и инструменты из mise.toml, зависимости по лок-файлу: агент запускает тесты и линтеры, как CI
      - uses: jdx/mise-action@v5
        if: steps.budget.outputs.allowed == 'true'
      - run: mise run install
        if: steps.budget.outputs.allowed == 'true'

      - name: Run Claude Code
        if: steps.budget.outputs.allowed == 'true'
        # Меньше тайм-аута задания: отчёт отличит таймаут агента от остальных ошибок
        timeout-minutes: 25
        uses: anthropics/claude-code-action@v1
        env:
          # Токен для gh в оболочке агента: публикация спецификации и тикетов в GitHub Issues
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Ключ только из секретов: токен подписки (claude setup-token) или API-ключ, задаётся один из двух
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Команда вызова (аналог mentions в OpenCode)
          trigger_phrase: '@claude'
          # PR из fork action пропускает по умолчанию (вход allow_fork_prs не задан, значит false):
          # чужой код не выгружается и не получает ключ модели. Вход не пишем явно, потому что
          # справочник actionlint о нём ещё не знает
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60

  # Итог без модели в PR, когда агент не ответил сам: бюджет исчерпан или запуск сорвался. Запускается
  # после остановки задания claude, в том числе по тайм-ауту или отмене
  report:
    needs: claude
    if: >-
      always() &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      (needs.claude.outputs.allowed == 'false' || needs.claude.result == 'failure' || needs.claude.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Publish outcome
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ALLOWED: ${{ needs.claude.outputs.allowed }}
          USED: ${{ needs.claude.outputs.used }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          steps=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[] | select(.name == "claude") | .steps[] | "\(.name)|\(.conclusion)|\(.started_at)|\(.completed_at)"')
          if [ -z "$steps" ]; then
            # Задание не начиналось: команду заменила в очереди более поздняя, она и ответит
            echo "Команда заменена в очереди более поздней, отчёт не нужен"
            exit 0
          fi
          if [ "$ALLOWED" = false ]; then
            reason=limit_exhausted
            detail="Бюджет запусков агента на этот PR исчерпан (${USED} из 3), модель не вызывалась."
          else
            agent=$(grep '^Run Claude Code|' <<< "$steps" || true)
            agent_conclusion=$(cut -d'|' -f2 <<< "$agent")
            if [ -z "$agent" ] || [ "$agent_conclusion" = skipped ] || [ "$agent_conclusion" = null ]; then
              reason=infra
              detail="Агент не стартовал: сбой подготовки (проверка бюджета, ключ модели, checkout, mise, зависимости)."
            else
              started=$(date -d "$(cut -d'|' -f3 <<< "$agent")" +%s)
              completed=$(date -d "$(cut -d'|' -f4 <<< "$agent")" +%s)
              # Тайм-аут шага агента 25 минут: остановка около этой границы — таймаут
              if [ $((completed - started)) -ge $((25 * 60 - 30)) ]; then
                reason=timeout
                detail="Агент остановлен по тайм-ауту шага (25 минут)."
              elif [ "$agent_conclusion" = cancelled ]; then
                reason=agent_failed
                detail="Запуск агента отменён до завершения. Причину нужно проверить по логам."
              else
                reason=agent_failed
                detail="Агент завершился с ошибкой. Причину нужно проверить по логам."
              fi
            fi
          fi
          sha=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          body="**Агент: нужен человек** · причина \`${reason}\`

          ${detail}

          - Последний SHA PR: \`${sha}\`
          - Логи: ${RUN_URL}

          Следующее действие выбирает человек: поднять бюджет в claude.yml, исправить вручную или пересмотреть подход."
          echo "$body"
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
